<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Exercise 02 - Form</title>
    <link rel="stylesheet" href="stylesform.css" />
  </head>
  <body>
    <main>
      <h1>Roth IRA Calculator</h1>

      <form>
        <div class="form-row">
          <label for="balance">Balance ($)</label>
          <input type="number" id="balance" name="balance">
        </div>

        <div class="form-row">
          <label for="annual">Annual contribution ($)</label>
          <input type="number" id="annual" name="annual">
        </div>

        <fieldset class="radio-group">
          <legend>Maximize contribution?</legend>

          <div class="radio-options">
            <label>
              <input type="radio" name="maximize" value="yes">
              Yes
            </label>

            <label>
              <input type="radio" name="maximize" value="no">
              No
            </label>
          </div>
        </fieldset>

        <div class="form-row">
          <label for="return">Expected rate of return (%)</label>
          <input type="number" id="return" name="return"
                min="0" max="15" step="1">
         </div>

        <div class="form-row">
          <label for="age">Current age</label>
          <input type="number" id="age" name="age"
                min="0" max="65" step="1">
          </div>

        <div class="form-row">
          <label for="retirement">Retirement age</label>
          <input type="number" id="retirement" name="retirement"
                 min="55" max="75" step="1">
          </div>

        <div class="form-row">
          <label for="tax">Marginal tax rate (%)</label>
          <input type="number" id="tax" name="tax"
                min="0" max="100" step="5">
          </div>

        <div class="buttons">
          <button type="submit">Calculate</button>
          <button type="reset">Reset</button>
        </div>
      </form>

      <p class="footer-text">
        This exercise is a simplified version of the Roth IRA
        Calculator at
        <a href="https://www.calculator.net/roth-ira-calculator.html">
          Calculator.net
        </a>
      </p>
    </main>
  </body>
</html>
